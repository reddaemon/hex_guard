syntax = "proto3";

package hex_guard;

service HexGuard {
  rpc AnalyzeMessage (Message) returns (AnalysisResult);
}

message Message {
  int64 chat_id = 1;
  string text = 2;
  int64 sender_id = 3;
  string sender_name = 4;
}

message AnalysisResult {
  uint32 score = 1;
  repeated string zones = 2;
  string final_url = 3;
}
